[build]
  command = "npm run build --prefix client"
  publish = "client/dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev --prefix client"
  targetPort = 5173
  publish = "client/dist"
  functions = "netlify/functions"
  framework = "#static"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200