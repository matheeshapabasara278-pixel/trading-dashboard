<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Professional Trading Gradient: Neon Blue to Mint Green -->
    <linearGradient id="mpGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3874FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card Shape -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="#0D1322" stroke="#3874FF" stroke-width="2" stroke-opacity="0.4" />

  <!-- Trading Chart Path (Uptrend) -->
  <path d="M 24 68 L 42 48 L 56 58 L 78 30" fill="none" stroke="url(#mpGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- MP Monogram / Nodes on Chart -->
  <circle cx="24" cy="68" r="5" fill="#3874FF" />
  <circle cx="42" cy="48" r="5" fill="#3874FF" />
  <circle cx="56" cy="58" r="5" fill="#10B981" />
  
  <!-- Peak Success Point (Pip) -->
  <circle cx="78" cy="30" r="7" fill="#34D399" filter="url(#glow)" />
  <circle cx="78" cy="30" r="3" fill="#0D1322" />
</svg>