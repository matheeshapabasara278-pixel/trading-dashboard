[build]
  command = "npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev --prefix client"
  targetPort = 5173
  publish = "client/dist"
  functions = "netlify/functions"
  framework = "#static"

[[redirects]]
  from = "/api/*"
  to = "http://localhost:5000/api/:splat"
  status = 200
  force = true